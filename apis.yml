aid: lumilens
name: Lumilens
description: >-
  Lumilens is a San Jose, California photonics company building optical interconnect
  silicon for AI data centers. Founded in 2024 by Ankur Singla (previously Contrail
  Systems and Volterra) with Ted Schmidt, Samuel Liu, Ritesh Kapahi and Dave Friedman,
  it designs co-packaged optics (CPO) and near-packaged optics (NPO) devices that let
  hyperscalers replace copper interconnect with fiber at 800Gb/s, 1.6Tb/s and beyond,
  attacking the connectivity bottleneck that now limits GPU cluster scaling more than
  compute does. The company emerged from stealth in August 2026 with more than $900M
  raised — including a $700M Series C at a $5.51B valuation led by Atreides Management,
  Bain Capital Ventures, Meritech, Seligman Ventures and Spark Capital — and says it is
  already shipping production optical interconnect into hyperscale AI data centers under
  a multi-billion-dollar customer agreement. Its product is physical silicon sold direct
  to a small set of very large buyers; as of this profile it publishes no developer
  program, API, SDK or machine-readable contract of any kind, and lumilens.com is still
  an interim recruiting and news site.
